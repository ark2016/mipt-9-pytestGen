name: Defense evidence

on:
  workflow_dispatch:
  push:
    branches: ["bench/defense-evidence"]

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server-b11459
  LLM_PORT: "8080"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
      HF_REVISION: f86cb2c1fa58255f8052cc32aeede1b7482d4361
      HF_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      PYTESTGEN_LLM_BASE_URL: http://localhost:8080/v1
      PYTESTGEN_LLM_MODEL: qwen2.5-coder-1.5b-instruct
      PYTESTGEN_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama-cache
          key: mbpp-${{ env.HF_REVISION }}-${{ env.HF_FILE }}
      - name: Start llama.cpp server
        run: |
          LLAMA_CACHE_DIR="$RUNNER_TEMP/llama-cache"
          mkdir -p "$LLAMA_CACHE_DIR"
          if [ ! -s "$LLAMA_CACHE_DIR/$HF_FILE" ]; then
            curl -fsSL --retry 3 \
              "https://huggingface.co/$HF_REPO/resolve/$HF_REVISION/$HF_FILE" \
              -o "$LLAMA_CACHE_DIR/$HF_FILE.part"
            mv "$LLAMA_CACHE_DIR/$HF_FILE.part" "$LLAMA_CACHE_DIR/$HF_FILE"
          fi
          docker run -d --name llm \
            -p "127.0.0.1:$LLM_PORT:8080" \
            -v "$LLAMA_CACHE_DIR:/models:ro" \
            "$LLAMA_IMAGE" \
            -m "/models/$HF_FILE" \
            --alias "$PYTESTGEN_LLM_MODEL" \
            --host 0.0.0.0 --port 8080 \
            --ctx-size 8192 --parallel 1 --threads "$(nproc)" \
            --jinja --no-webui

      - name: Wait for the server
        run: |
          deadline=$((SECONDS + 900))
          until curl -fsS "http://localhost:$LLM_PORT/health" >/dev/null 2>&1; do
            if [ "$(docker inspect -f '{{.State.Running}}' llm)" != "true" ]; then
              echo "llama.cpp container exited" >&2
              docker logs llm | tail -n 100 >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "llama.cpp did not become healthy within 15 minutes" >&2
              docker logs llm | tail -n 100 >&2
              exit 1
            fi
            sleep 5
          done
          curl -fsS "http://localhost:$LLM_PORT/v1/models"

      - run: uv sync --frozen
      - name: Measure repair warnings and oracle review
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          uv run --frozen python scripts/bench_heuristic.py --shard "$SHARD" --shards 4
          --output "out/heuristic-shard-$SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heuristic-shard-${{ matrix.shard }}
          path: out/heuristic-shard-*.json

  library:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
      HF_REVISION: f86cb2c1fa58255f8052cc32aeede1b7482d4361
      HF_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      PYTESTGEN_LLM_BASE_URL: http://localhost:8080/v1
      PYTESTGEN_LLM_MODEL: qwen2.5-coder-1.5b-instruct
      PYTESTGEN_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama-cache
          key: mbpp-${{ env.HF_REVISION }}-${{ env.HF_FILE }}
      - name: Start llama.cpp server
        run: |
          LLAMA_CACHE_DIR="$RUNNER_TEMP/llama-cache"
          mkdir -p "$LLAMA_CACHE_DIR"
          if [ ! -s "$LLAMA_CACHE_DIR/$HF_FILE" ]; then
            curl -fsSL --retry 3 \
              "https://huggingface.co/$HF_REPO/resolve/$HF_REVISION/$HF_FILE" \
              -o "$LLAMA_CACHE_DIR/$HF_FILE.part"
            mv "$LLAMA_CACHE_DIR/$HF_FILE.part" "$LLAMA_CACHE_DIR/$HF_FILE"
          fi
          docker run -d --name llm \
            -p "127.0.0.1:$LLM_PORT:8080" \
            -v "$LLAMA_CACHE_DIR:/models:ro" \
            "$LLAMA_IMAGE" \
            -m "/models/$HF_FILE" \
            --alias "$PYTESTGEN_LLM_MODEL" \
            --host 0.0.0.0 --port 8080 \
            --ctx-size 8192 --parallel 1 --threads "$(nproc)" \
            --jinja --no-webui

      - name: Wait for the server
        run: |
          deadline=$((SECONDS + 900))
          until curl -fsS "http://localhost:$LLM_PORT/health" >/dev/null 2>&1; do
            if [ "$(docker inspect -f '{{.State.Running}}' llm)" != "true" ]; then
              echo "llama.cpp container exited" >&2
              docker logs llm | tail -n 100 >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "llama.cpp did not become healthy within 15 minutes" >&2
              docker logs llm | tail -n 100 >&2
              exit 1
            fi
            sleep 5
          done
          curl -fsS "http://localhost:$LLM_PORT/v1/models"

      - run: uv sync --frozen
      - name: Evaluate python-slugify with and without its upstream tests
        run: >-
          uv run --frozen --with text-unidecode==1.3 python scripts/bench_library.py
          --mode both --output out/library-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-report
          path: out/library-benchmark/

  aggregate:
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: heuristic-shard-*
          path: out/shards
      - name: Combine all conditions
        run: |
          uv run --frozen python scripts/bench_heuristic.py --combine out/shards
          uv run --frozen python -c 'import json; r=json.load(open("out/heuristic-report.json")); assert r["usage"]["completion_tokens"]>0; print(json.dumps(r["summary"], indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-report
          path: out/heuristic-report.json
