# Ruff, mypy and uv come from uv.lock (local hooks), so pre-commit, CI and the
# developer machine always run the same tool versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
