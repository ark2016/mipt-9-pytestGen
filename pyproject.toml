[project]
name = "pytestgen"
version = "0.1.0"
description = "LLM-assisted pytest test generator with concolic-lite (AST + Z3) path exploration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arkadiy Lebedev" }]
keywords = ["pytest", "test-generation", "llm", "concolic", "z3", "coverage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # CLI and UX
    "typer>=0.12",
    "rich>=13.7",
    # configuration and logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # LLM over OpenAI-compatible HTTP API
    "httpx>=0.27",
    "tenacity>=8.3",
    # symbolic part
    "z3-solver>=4.13",
    # the sandbox runs generated tests with these, so they are runtime dependencies
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "coverage[toml]>=7.5",
]

[project.scripts]
pytestgen = "pytestgen.cli:app"

[dependency-groups]
dev = [
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytestgen"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["examples/**/expected", "tests/fixtures/modules"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "C4",            # comprehensions
    "PTH",           # pathlib
    "RUF",           # ruff-specific
    "T20",           # no print in production code
    "S",             # bandit subset
    "N",             # naming
    "PL",            # pylint subset
]
ignore = [
    "PLR0913",  # many arguments: dataclass-like constructors
    "PLR2004",  # magic values in comparisons
    "S603",     # subprocess without shell: the sandbox needs it by design
    "RUF001", "RUF002", "RUF003",  # cyrillic in strings/comments is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "PLC0415", "T20"]
"examples/**" = ["S101", "T20"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/pytestgen"]

[[tool.mypy.overrides]]
module = ["z3", "z3.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: integration tests that call a real LLM server (deselect with -m 'not slow')",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["pytestgen"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
